<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Task App</title>
    <link rel="icon" type="image/svg+xml" href="/task-icon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f1116" />
    <script>try{if(localStorage.getItem("tt_theme")==="light"){document.documentElement.classList.add("theme-light");document.querySelector('meta[name="theme-color"]').setAttribute("content","#f3f4f7");}}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>document.addEventListener("contextmenu",function(e){if(e.defaultPrevented)return;var t=e.target;if(t&&t.closest&&t.closest("input,textarea,select,[contenteditable],[contenteditable=true]"))return;e.preventDefault()});</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
